      ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEOGmVpn7RAatSVvctYDrWkCEFPU3CeQoswqIIPzF/U9
  - name: nikitaslipenchuk
    ssh_public_key: |
      ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHwzuTrxNLxECMBKNA5Or3DfjoShBZjL1J4yrZ0LsYhp vsfi-nikitaslipenchuk
  - name: RidRapsody
    ssh_public_key: |
      ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGJjhXUlwEqNuuQu/tDjIEYrV55BeToABnXLVAPE3DEn vsfi-RidRapsody
  - name: quuuqq11
