set_users_deploy:
  - name: deployer
    ssh_public_key: |
      ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIA9SeNAhdyLbRJzqmHm2oWRu3auNLLjfJ1Xo+xnn4kNx vsfi-deployer

# === Domain ===
domain: "vsfi.team"
subdomain: "team01"
fulldomain: "{{ subdomain }}.{{ domain }}"

# === Роль: set_docker ===
set_docker_sudo: "{{ set_users_sudo }}"
set_docker_deploy: "{{ set_users_deploy }}"
set_docker_registries:
  - "registry.{{ fulldomain }}"
set_docker_username: gitlab-ci
set_docker_password: "{{ vault_docker_password }}"

# === Роль: set_docker_network ===
set_docker_network_overlay:
  - name: traefik-public
    encrypted: false
  - name: grafana-internal
    encrypted: true
    internal: true
  - name: postgres-internal
    encrypted: true
    internal: true
  - name: frontend-internal
    encrypted: true
    internal: true
  - name: backend-internal
    encrypted: true
    internal: true

# === Роль: deploy-hashicorp-vault ===
vault_domain: "vault.{{ fulldomain }}"
vault_allowed_domain: "{{ fulldomain }}"
vault_role_name: "team01"
vault_root_pki: "pki-root"
vault_int_pki: "pki-int"
vault_cert_ttl: "720h" # 30 days
vault_default_lease_ttl: "168h" # 7 days
vault_max_lease_ttl: "720h" # 30 days

# === Роль: deploy-portainer ===
portainer_domain: "prt.{{ fulldomain }}"

# === Роль: deploy-postgres ===
postgres_password: "{{ vault_postgres_password }}"

# === Роль: deploy-keycloak ===
keycloak_db: "keycloak"
keycloak_db_user: "keycloak"
keycloak_db_password: "{{ vault_keycloak_db_password }}"
keycloak_domain: "auth.{{ fulldomain }}"
keycloak_realm_name: "vsfi"
keycloak_admin_user: "dauxdu"
keycloak_admin_password: "{{ vault_keycloak_admin_password }}"
keycloak_realm_admin_users:
  - dauxdu
  - nikitaslipenchuk
keycloak_realm_editor_users:
  - RidRapsody
keycloak_realm_viewer_users:
  - quuuqq11
  - Kosta110606

# === Роль: deploy-grafana ===
grafana_oauth_id: "grafana-oauth"
grafana_oauth_secret: "{{ vault_grafana_oauth_secret }}"
grafana_domain: "gr.{{ fulldomain }}"

# === LGTM Стек (deploy-prometheus, deploy-loki, deploy-tempo) ===
prometheus_domain: "prom.{{ fulldomain }}"
loki_domain: "loki.{{ fulldomain }}"
tempo_domain: "tempo.{{ fulldomain }}"

# === Роль: deploy-alertmanager ===
alertmanager_domain: "alert.{{ fulldomain }}"
telegram_bot_token: "{{ vault_telegram_bot_token }}"
telegram_chat_id: 536988073

# === Роль: deploy-blackbox-exporter ===
blackbox_http_targets:
  - "https://{{ fulldomain }}"
  - "https://{{ vault_domain }}"
  - "https://{{ keycloak_domain }}"
  - "https://{{ grafana_domain }}"
  - "https://{{ prometheus_domain }}"
  - "https://{{ alertmanager_domain }}"
  - "https://{{ gitlab_domain }}"
  - "https://{{ rustfs_domain }}"
  - "https://{{ nexus_domain }}"

# === GitLab (deploy-gitlab-standalone, deploy-gitlab-runner) ===
gitlab_domain: "git.{{ fulldomain }}"
gitlab_root_password: "{{ vault_gitlab_root_password }}"
gitlab_runner_token: "{{ vault_gitlab_runner_token }}"

# === Роль: deploy-rustfs (S3) ===
rustfs_domain: "s3.{{ fulldomain }}"
rustfs_user: "dauxdu"
rustfs_password: "{{ vault_rustfs_password }}"
s3_endpoint: "https://{{ rustfs_domain }}"
s3_bucket: "postgres-backups"
s3_access_key: "{{ rustfs_user }}"
s3_secret_key: "{{ rustfs_password }}"

# === Роль: deploy-nexus ===
nexus_domain: "nexus.{{ fulldomain }}"
nexus_registry_domain: "registry.{{ fulldomain }}"

# === Роль: deploy-postgres-backup ===
backup_encryption_key: "{{ vault_backup_encryption_key }}"
backup_databases:
  - "{{ keycloak_db }}"
