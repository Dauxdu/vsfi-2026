---
- name: Wait for Vault to be ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ vault_port }}/v1/sys/health"
    method: GET
    status_code: [200, 429, 472, 473, 501, 503]
  register: vault_health
  until: vault_health.status in [200, 429, 472, 473, 501, 503]
  retries: 30
  delay: 5

- name: Check Vault initialization status
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ vault_port }}/v1/sys/init"
    method: GET
    status_code: [200]
  register: vault_init_status

- name: Initialize Vault (First run only)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ vault_port }}/v1/sys/init"
    method: POST
    body_format: json
    body:
      secret_shares: 1
      secret_threshold: 1
    status_code: [200]
  register: vault_init_result
  when: vault_init_status.json is defined and not vault_init_status.json.initialized

- name: Save Vault keys to disk
  ansible.builtin.copy:
    content: "{{ vault_init_result.json | to_nice_json }}"
    dest: "{{ vault_data_path }}/vault_keys.json"
    owner: root
    group: root
    mode: "0400"
  when: vault_init_result is changed

- name: Check if Docker secret 'vault_keys.json' already exists
  ansible.builtin.command:
    cmd: docker secret inspect vault_keys.json
  register: docker_secret_check
  changed_when: false
  failed_when: false
  delegate_to: "{{ groups['swarm_managers'][0] }}"
  run_once: true

- name: Remove outdated Docker secret if vault was re-initialized
  ansible.builtin.command:
    cmd: docker secret rm vault_keys.json
  when:
    - vault_init_result is changed
    - docker_secret_check.rc == 0
  delegate_to: "{{ groups['swarm_managers'][0] }}"
  run_once: true
  register: secret_rm_result
  failed_when: false

- name: Create Docker secret 'vault_keys.json'
  ansible.builtin.command:
    cmd: docker secret create vault_keys.json {{ vault_data_path }}/vault_keys.json
  when: >
    docker_secret_check.rc != 0
    or (vault_init_result is changed)
  delegate_to: "{{ groups['swarm_managers'][0] }}"
  run_once: true
  register: secret_create_result
  changed_when: secret_create_result.rc == 0

- name: Verify Docker secret was created
  ansible.builtin.command:
    cmd: docker secret inspect vault_keys.json
  register: secret_verify
  changed_when: false
  delegate_to: "{{ groups['swarm_managers'][0] }}"
  run_once: true
  when: secret_create_result is changed

- name: Set Vault credentials from new initialization
  ansible.builtin.set_fact:
    vault_token: "{{ vault_init_result.json.root_token }}"
    vault_unseal_key: "{{ vault_init_result.json.keys_base64[0] }}"
  when: vault_init_result is changed

- name: Read existing Vault keys if already initialized
  block:
    - name: Read Vault keys from disk
      ansible.builtin.slurp:
        src: "{{ vault_data_path }}/vault_keys.json"
      register: vault_keys_file

    - name: Set Vault credentials from existing file
      ansible.builtin.set_fact:
        vault_token: "{{ (vault_keys_file.content | b64decode | from_json).root_token }}"
        vault_unseal_key: "{{ (vault_keys_file.content | b64decode | from_json).keys_base64[0] }}"
  when: vault_init_status.json is defined and vault_init_status.json.initialized

- name: Check Vault seal status
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ vault_port }}/v1/sys/seal-status"
    method: GET
    status_code: [200, 503]
  register: vault_seal_status

- name: Unseal Vault
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ vault_port }}/v1/sys/unseal"
    method: POST
    body_format: json
    body:
      key: "{{ vault_unseal_key }}"
  when:
    - vault_seal_status.json.sealed
    - vault_unseal_key is defined
