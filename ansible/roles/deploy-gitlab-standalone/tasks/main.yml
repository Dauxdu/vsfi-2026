---
- name: Install prerequisite packages on CICD node
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - tzdata
      - perl
    state: present
    update_cache: true

- name: Deploy GitLab firewall rules
  ansible.builtin.template:
    src: gitlab.nft.j2
    dest: /etc/nftables.d/gitlab.nft
    owner: root
    group: root
    mode: "0644"
  notify: Reload nftables

# --- Репозиторий GitLab CE ---
- name: Check if GitLab CE repository is already added
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/gitlab_gitlab-ce.list
  register: gitlab_repo_file

- name: Download GitLab CE repository script
  ansible.builtin.get_url:
    url: "https://packages.gitlab.com/install/repositories/gitlab/gitlab-ce/script.deb.sh"
    dest: /tmp/gitlab-ce-repo.sh
    mode: "0755"
  when: not gitlab_repo_file.stat.exists

- name: Add GitLab CE repository
  ansible.builtin.command:
    cmd: /tmp/gitlab-ce-repo.sh
  when: not gitlab_repo_file.stat.exists
  changed_when: true

- name: Remove GitLab CE repository script
  ansible.builtin.file:
    path: /tmp/gitlab-ce-repo.sh
    state: absent

- name: Create GitLab configuration directory
  ansible.builtin.file:
    path: "{{ gitlab_config_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Generate GitLab standalone configuration
  ansible.builtin.template:
    src: gitlab.rb.j2
    dest: "{{ gitlab_config_path }}/gitlab.rb"
    owner: root
    group: root
    mode: "0600"
  register: gitlab_config

- name: Install GitLab CE package
  ansible.builtin.apt:
    name: gitlab-ce
    state: present
    update_cache: false
  register: gitlab_install

- name: Run gitlab-ctl reconfigure
  ansible.builtin.command:
    cmd: gitlab-ctl reconfigure
  when: gitlab_config.changed or gitlab_install.changed
  changed_when: "'gitlab Reconfigured!' in reconfigure_result.stdout"

- name: Ensure Traefik dynamic directory exists on mgmt
  ansible.builtin.file:
    path: /opt/traefik/dynamic
    state: directory
    owner: root
    group: root
    mode: "0755"
  delegate_to: "{{ groups['mgmt'][0] }}"
  run_once: true

- name: Deploy Traefik dynamic config for GitLab standalone
  ansible.builtin.template:
    src: gitlab.yml.j2
    dest: /opt/traefik/dynamic/gitlab.yml
    owner: root
    group: root
    mode: "0644"
  delegate_to: "{{ groups['mgmt'][0] }}"
  run_once: true
