---
- name: Create nginx-exporter directory
  ansible.builtin.file:
    path: "{{ nginx_exporter_data_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy nginx-exporter stack
  ansible.builtin.include_role:
    name: deploy_docker_stack
  vars:
    stack_name: nginx-exporter
    stack_compose_path: "{{ nginx_exporter_data_path }}/compose.yml"
