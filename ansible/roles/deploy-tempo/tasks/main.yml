---
- name: Create Tempo directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ tempo_data_path | dirname }}"
    - "{{ tempo_data_path }}"

- name: Generate Tempo config
  ansible.builtin.template:
    src: config.yml.j2
    dest: "{{ tempo_data_path }}/config.yml"
    owner: root
    group: root
    mode: "0644"

- name: Deploy Tempo stack
  ansible.builtin.include_role:
    name: deploy-docker-stack
  vars:
    stack_name: tempo
    stack_compose_path: "{{ tempo_data_path }}/compose.yml"
