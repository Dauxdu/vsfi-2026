---
- name: Create Promtail directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ promtail_data_path | dirname }}"
    - "{{ promtail_data_path }}"

- name: Generate Promtail config
  ansible.builtin.template:
    src: config.yml.j2
    dest: "{{ promtail_data_path }}/config.yml"
    owner: root
    group: root
    mode: "0644"

- name: Deploy Promtail stack
  ansible.builtin.include_role:
    name: deploy_docker_stack
  vars:
    stack_name: promtail
    stack_compose_path: "{{ promtail_data_path }}/compose.yml"
