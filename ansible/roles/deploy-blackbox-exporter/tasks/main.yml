---
- name: Create Blackbox Exporter directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ blackbox_exporter_data_path | dirname }}"
    - "{{ blackbox_exporter_data_path }}"

- name: Generate Blackbox Exporter config
  ansible.builtin.template:
    src: config.yml.j2
    dest: "{{ blackbox_exporter_data_path }}/config.yml"
    owner: root
    group: root
    mode: "0644"

- name: Deploy Blackbox Exporter stack
  ansible.builtin.include_role:
    name: deploy-docker-stack
  vars:
    stack_name: blackbox-exporter
    stack_compose_path: "{{ blackbox_exporter_data_path }}/compose.yml"
