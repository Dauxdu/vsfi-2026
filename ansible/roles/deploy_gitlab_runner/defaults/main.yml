---
gitlab_runner_config_path: "/etc/gitlab-runner"

gitlab_runner_concurrent: 4
gitlab_runner_check_interval: 0
gitlab_runner_session_timeout: 1800

gitlab_runner_description: "docker-buildx-{{ inventory_hostname }}"
gitlab_domain: "git.localhost"
gitlab_runner_token: ""
gitlab_runner_executor: "shell"
gitlab_runner_tls_ca_file: "/etc/gitlab-runner/certs/vault-ca.crt"
gitlab_runner_environment:
  - "DOCKER_BUILDKIT=1"
  - "BUILDKIT_PROGRESS=plain"
