apiVersion: 1

providers:
  - name: "infrastructure"
    orgId: 1
    folder: "Infrastructure"
    folderUid: "infra"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/infra
      foldersFromFilesStructure: false

  - name: "vsfi"
    orgId: 1
    folder: "VSFI"
    folderUid: "vsfi"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/vsfi
      foldersFromFilesStructure: false
