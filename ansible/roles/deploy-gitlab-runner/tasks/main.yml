---
- name: Install prerequisite packages on CICD node
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - tzdata
      - perl
      - git
    state: present
    update_cache: true

- name: Check if GitLab Runner repository is already added
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/runner_gitlab-runner.list
  register: gitlab_runner_repo_file

- name: Download GitLab Runner repository script
  ansible.builtin.get_url:
    url: "https://packages.gitlab.com/install/repositories/runner/gitlab-runner/script.deb.sh"
    dest: /tmp/gitlab-runner-repo.sh
    mode: "0755"
  when: not gitlab_runner_repo_file.stat.exists

- name: Add GitLab Runner repository
  ansible.builtin.command:
    cmd: /tmp/gitlab-runner-repo.sh
  when: not gitlab_runner_repo_file.stat.exists
  changed_when: true

- name: Remove GitLab Runner repository script
  ansible.builtin.file:
    path: /tmp/gitlab-runner-repo.sh
    state: absent

- name: Install GitLab Runner package
  ansible.builtin.apt:
    name: gitlab-runner
    state: present
    update_cache: false

- name: Ensure gitlab-runner user exists
  ansible.builtin.user:
    name: gitlab-runner
    shell: /bin/bash
    home: /home/gitlab-runner
    create_home: true
    state: present

- name: Ensure gitlab-runner home permissions
  ansible.builtin.file:
    path: /home/gitlab-runner
    state: directory
    owner: gitlab-runner
    group: gitlab-runner
    mode: "0750"

- name: Add gitlab-runner user to docker group
  ansible.builtin.user:
    name: gitlab-runner
    groups: docker
    append: true
  notify: Restart gitlab-runner

- name: Create GitLab Runner directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ gitlab_runner_config_path }}"
    - "{{ gitlab_runner_config_path }}/certs"

- name: Fetch Vault CA from mgmt node
  ansible.builtin.slurp:
    src: /opt/vault/certs/root-ca.crt
  delegate_to: "{{ groups['mgmt'][0] }}"
  register: vault_ca_file

- name: Install Vault CA for GitLab Runner
  ansible.builtin.copy:
    content: "{{ vault_ca_file.content | b64decode }}"
    dest: "{{ gitlab_runner_tls_ca_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart gitlab-runner

- name: Install Vault CA as GitLab domain certificate
  ansible.builtin.copy:
    content: "{{ vault_ca_file.content | b64decode }}"
    dest: "{{ gitlab_runner_config_path }}/certs/{{ gitlab_domain }}.crt"
    owner: root
    group: root
    mode: "0644"
  notify: Restart gitlab-runner

- name: Install Vault CA into system trust store
  ansible.builtin.copy:
    content: "{{ vault_ca_file.content | b64decode }}"
    dest: /usr/local/share/ca-certificates/vault-ca.crt
    owner: root
    group: root
    mode: "0644"
  register: vault_system_ca

- name: Update system CA certificates store
  ansible.builtin.command:
    cmd: update-ca-certificates
  when: vault_system_ca.changed
  changed_when: true

- name: Check if GitLab Runner is already registered
  ansible.builtin.command:
    cmd: gitlab-runner verify
  register: runner_verify
  changed_when: false
  failed_when: false

- name: Register GitLab Runner
  ansible.builtin.command:
    cmd: >
      gitlab-runner register
      --non-interactive
      --url "https://{{ gitlab_domain }}"
      --token "{{ gitlab_runner_token }}"
      --description "{{ gitlab_runner_description }}"
      --executor "{{ gitlab_runner_executor }}"
  when:
    - gitlab_runner_token | default('') | trim | length > 0
    - runner_verify.rc != 0
  no_log: true
  changed_when: true
  notify: Restart gitlab-runner

- name: Generate GitLab Runner configuration
  ansible.builtin.template:
    src: config.toml.j2
    dest: "{{ gitlab_runner_config_path }}/config.toml"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart gitlab-runner

- name: Verify Docker is accessible by gitlab-runner
  ansible.builtin.command:
    cmd: docker info
  become: true
  become_user: gitlab-runner
  environment:
    HOME: /home/gitlab-runner
  changed_when: false

- name: Verify Docker Buildx is available for gitlab-runner
  ansible.builtin.command:
    cmd: docker buildx version
  become: true
  become_user: gitlab-runner
  environment:
    HOME: /home/gitlab-runner
  changed_when: false

- name: Verify GitLab Runner configuration
  ansible.builtin.command:
    cmd: gitlab-runner verify
  changed_when: false
