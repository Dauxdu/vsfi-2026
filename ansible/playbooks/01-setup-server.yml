---
- name: Base OS Hardening and Prerequisites Setup
  hosts: all
  gather_facts: true
  roles:
    - role: set-netplan
    - role: set-hostname
    - role: set-timezone
    - role: set-repository
      when:
        - apt_urls | default([]) | length > 0
        - apt_repositories | default([]) | length > 0
    - role: set-packages
    - role: set-users
    - role: set-firewall
    - role: set-ssh
    - role: set-motd
